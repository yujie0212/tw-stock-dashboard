<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#151c25">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>台股選股監控台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: sticky status bar → one-line daily summary → picks (wide) beside market + gate → schedule & data strip */
/* 固定深色主題 */
:root {
  --bg: #0d1218;
  --surface: #151c25;
  --line: #263140;
  --fg: #e6ebf2;
  --muted: #8e9bad;
  --accent: #7fb0e6;
  --accent-soft: #1b2a3b;
  --up: #f0776b;      /* 台股慣例：紅漲 */
  --down: #4cc492;    /* 綠跌 */
  --warn: #e5b05c;
  --warn-soft: #30271a;
  --ok-soft: #142d23;
  --up-soft: #3a1f1d;
  --font-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.55;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface);
}
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.up { color: var(--up); }
.down { color: var(--down); }
.wrap {
  max-width: 1120px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* Top bar */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--surface); border-bottom: 1px solid var(--line);
}
.topbar .wrap {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px;
  padding-block: 12px;
}
.brand { display: flex; align-items: baseline; gap: 10px; margin-right: auto; }
.brand h1 { font-size: 18px; margin: 0; font-weight: 700; letter-spacing: .02em; }
.brand .date { color: var(--muted); font-size: 13px; }
.pill {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 12.5px; font-weight: 500; padding: 3px 10px; border-radius: 999px;
  white-space: nowrap;
}
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.pill.ok { background: var(--ok-soft); color: var(--down); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.idle { background: var(--accent-soft); color: var(--muted); }

.notice {
  font-size: 13px; color: var(--warn); background: var(--warn-soft);
  padding: 8px 12px; border-radius: 6px; margin-bottom: 14px;
}
.notice.bad { color: var(--up); background: var(--up-soft); }
.notice a { color: inherit; font-weight: 500; margin-left: 6px; }

/* Summary line */
.summary { padding-block: 20px 8px; }
.summary p { margin: 0; font-size: 17px; max-width: 62ch; text-wrap: pretty; }
.summary strong { font-weight: 700; }

/* Main grid */
.grid {
  display: grid; gap: 16px; padding-block: 12px 32px;
  grid-template-columns: minmax(0, 1.65fr) minmax(0, 1fr);
  align-items: start;
}
.side { display: grid; gap: 16px; min-width: 0; }
@media (max-width: 860px) { .grid { grid-template-columns: minmax(0, 1fr); } }

.panel {
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  min-width: 0;
}
.panel-head {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px;
  padding: 14px 16px 10px;
}
.panel-head h2 { font-size: 15px; margin: 0; font-weight: 700; margin-right: auto; text-wrap: balance; }
.label {
  font-size: 11.5px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase;
}

/* Tabs */
.tabs { display: flex; gap: 4px; padding: 0 16px; border-bottom: 1px solid var(--line); overflow-x: auto; overflow-y: hidden; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  background: none; border: 0; font: inherit; color: var(--muted); cursor: pointer;
  padding: 8px 10px 10px; border-bottom: 2px solid transparent;
  display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
}
.tab[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); font-weight: 500; }
.tab:focus-visible, .seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.tab .count { font-family: var(--font-num); font-size: 12px; color: var(--muted); }
.tab .paused { font-size: 11px; color: var(--warn); }

.channel {
  display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center;
  padding: 10px 16px; font-size: 13px; color: var(--muted);
}

/* Picks table */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th {
  text-align: left; font-weight: 500; font-size: 12px; color: var(--muted);
  padding: 8px 16px; border-bottom: 1px solid var(--line); white-space: nowrap;
}
td { padding: 11px 16px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
th.r, td.r { text-align: right; }
.stock { display: flex; flex-direction: column; }
.stock .code { font-family: var(--font-num); font-size: 12.5px; color: var(--muted); }
.stock .name { font-weight: 500; white-space: nowrap; }
.reason { color: var(--muted); font-size: 13px; min-width: 180px; }
.tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.tag { font-size: 11.5px; padding: 1px 7px; border-radius: 4px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
.empty { padding: 28px 16px; color: var(--muted); font-size: 14px; }
.empty strong { color: var(--fg); display: block; margin-bottom: 4px; }

/* Market */
.market { padding: 0 16px 16px; display: grid; gap: 14px; }
.index-row { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; align-items: end; }
.index-row .name { font-size: 13px; color: var(--muted); }
.index-row .val { font-family: var(--font-num); font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
.index-row .chg { font-family: var(--font-num); font-size: 13px; text-align: right; }
.spark { grid-column: 1 / -1; width: 100%; height: 44px; display: block; }
.flows { display: grid; gap: 8px; border-top: 1px solid var(--line); padding-top: 12px; }
.flow { display: grid; grid-template-columns: 4.5em 1fr 6.5em; align-items: center; gap: 10px; font-size: 13px; }
.flow .bar-track { height: 8px; background: var(--bg); border-radius: 4px; position: relative; overflow: hidden; }
.flow .bar { position: absolute; top: 0; bottom: 0; border-radius: 4px; }
.flow .bar-track::after { content: ""; position: absolute; left: 50%; top: -2px; bottom: -2px; width: 1px; background: var(--line); }
.flow .amt { text-align: right; }

/* Gate */
.gate { padding: 0 16px 16px; display: grid; gap: 12px; }
.gate-strategy { display: grid; gap: 6px; }
.gate-strategy .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.gate-strategy .top b { font-size: 14px; }
.periods { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.period { border: 1px dashed var(--line); border-radius: 6px; padding: 6px 8px; font-size: 12px; color: var(--muted); }
.period .v { display: block; font-family: var(--font-num); color: var(--fg); font-size: 13px; margin-top: 2px; }
.rules { margin: 0; padding: 10px 0 0; border-top: 1px solid var(--line); list-style: none; display: grid; gap: 4px; font-size: 12.5px; color: var(--muted); }
.rules li::before { content: "·"; margin-right: 6px; color: var(--accent); font-weight: 700; }

/* Bottom: schedule + data */
.bottom { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); padding-bottom: 40px; }
@media (max-width: 860px) { .bottom { grid-template-columns: minmax(0, 1fr); } }
.timeline { list-style: none; margin: 0; padding: 0 16px 16px; display: grid; }
.timeline li { display: grid; grid-template-columns: 3.6em 1fr auto; gap: 12px; padding: 9px 0; border-top: 1px solid var(--line); align-items: baseline; font-size: 14px; }
.timeline li:first-child { border-top: 0; }
.timeline .t { font-family: var(--font-num); font-weight: 500; }
.timeline .d { color: var(--muted); font-size: 12.5px; display: block; }
.progress-list { padding: 0 16px 16px; display: grid; gap: 12px; }
.prog .row { display: flex; justify-content: space-between; gap: 8px; font-size: 13.5px; margin-bottom: 5px; }
.prog .row span:last-child { color: var(--muted); font-family: var(--font-num); font-size: 12.5px; white-space: nowrap; }
.prog .track { height: 6px; border-radius: 3px; background: var(--bg); overflow: hidden; }
.prog .fill { height: 100%; background: var(--accent); border-radius: 3px; }
.prog.done .fill { background: var(--down); }
.prog .sub { font-size: 12px; color: var(--muted); margin-top: 4px; }

footer { color: var(--muted); font-size: 12px; padding-block: 0 32px; }

@media (max-width: 520px) {
  .summary p { font-size: 16px; }
  .reason { min-width: 150px; }
  th, td { padding-left: 12px; padding-right: 12px; }
}
@media (prefers-reduced-motion: no-preference) {
  .tab { transition: color .15s, border-color .15s; }
}

.pill.bad { background: var(--up-soft); color: var(--up); }
.period.pass { border-style: solid; border-color: var(--down); }
.period.fail { border-style: solid; border-color: var(--up); }
.period .n { display: block; font-size: 11px; }
.gate-note { margin: 0; font-size: 12.5px; color: var(--muted); }
.prog.failed .fill { background: var(--up); }
</style>
</head>
<body>

<header class="topbar">
  <div class="wrap">
    <div class="brand">
      <h1>台股選股監控台</h1>
      <span class="date num" id="trade-date">—</span>
    </div>
    <span class="pill idle" id="pipeline-pill">載入中</span>
    <span class="pill idle" id="channel-pill" hidden></span>
  </div>
</header>

<main>
  <section class="wrap summary" aria-label="今日摘要">
    <div class="notice" id="notice" hidden></div>
    <p id="summary">讀取資料中…</p>
  </section>

  <div class="wrap grid">
    <section class="panel" aria-labelledby="picks-title">
      <div class="panel-head">
        <h2 id="picks-title">今日選股</h2>
        <span class="label" id="universe"></span>
      </div>
      <div class="tabs" role="tablist" aria-label="策略" id="tabs"></div>
      <div class="channel" id="channel"></div>
      <div id="picks"></div>
    </section>

    <div class="side">
      <section class="panel" aria-labelledby="mkt-title">
        <div class="panel-head">
          <h2 id="mkt-title">大盤概況</h2>
          <span class="label" id="mkt-date"></span>
        </div>
        <div class="market" id="market"></div>
      </section>

      <section class="panel" aria-labelledby="gate-title">
        <div class="panel-head">
          <h2 id="gate-title">策略驗證關卡</h2>
          <span class="pill idle" id="gate-pill">—</span>
        </div>
        <div class="gate" id="gate"></div>
      </section>
    </div>
  </div>

  <div class="wrap bottom">
    <section class="panel" aria-labelledby="sched-title" id="schedule-panel">
      <div class="panel-head"><h2 id="sched-title">每日排程</h2><span class="label">台灣時間</span></div>
      <ol class="timeline" id="schedule"></ol>
    </section>

    <section class="panel" aria-labelledby="data-title" id="backfill-panel">
      <div class="panel-head"><h2 id="data-title">歷史回補進度</h2><span class="label">一次性 · 回測用</span></div>
      <div class="progress-list" id="backfill"></div>
    </section>
  </div>

  <footer class="wrap" id="footer">資料來源：證交所、櫃買中心公開資料。本頁僅供個人研究參考，不構成投資建議。</footer>
</main>

<script>
const DEMO = location.hash === '#demo';
const SRC = DEMO ? 'data/example.json' : 'data/latest.json';
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const has = (v) => v !== null && v !== undefined;
const fmt = (n, d) => has(n) ? Number(n).toLocaleString('zh-TW', { minimumFractionDigits: d ?? (Math.abs(n) < 1000 ? 2 : 0), maximumFractionDigits: d ?? 2 }) : '—';
const dir = (n) => n > 0 ? 'up' : n < 0 ? 'down' : '';
const signed = (n, d = 2) => has(n) ? (n > 0 ? '+' : n < 0 ? '−' : '') + fmt(Math.abs(n), d) : '—';
const WEEK = '日一二三四五六';

const STATUS = {
  done: ['ok', '完成'], ok: ['ok', '完成'], sent: ['ok', '已送出'],
  running: ['idle', '執行中'], scheduled: ['idle', '排程中'], pending: ['idle', '等待中'],
  failed: ['bad', '失敗'], skipped: ['idle', '略過']
};
const pill = (status, text) => {
  const [cls, label] = STATUS[status] || ['idle', status || '—'];
  return `<span class="pill ${cls}">${esc(text || label)}</span>`;
};
const empty = (title, text) => `<div class="empty"><strong>${esc(title)}</strong>${esc(text)}</div>`;

function showNotice(html, kind) {
  const n = $('notice');
  n.className = 'notice ' + (kind || '');
  n.innerHTML = html;
  n.hidden = false;
}

function renderHeader(d) {
  if (d.trade_date) {
    const day = new Date(d.trade_date + 'T12:00:00Z').getUTCDay();
    $('trade-date').textContent = `${d.trade_date}（${WEEK[day]}）`;
  }
  const p = d.pipeline || {};
  const pp = $('pipeline-pill');
  const [cls, label] = STATUS[p.status] || ['idle', '狀態不明'];
  pp.className = 'pill ' + cls;
  pp.textContent = `收盤後流程${label}${p.finished_at ? ' ' + p.finished_at : ''}`;
  const cp = $('channel-pill');
  cp.hidden = false;
  if (d.channel === 'live') { cp.className = 'pill ok'; cp.textContent = '正式推播'; }
  else { cp.className = 'pill warn'; cp.textContent = '測試頻道模式'; }

  const st = d.strategies || {};
  const parts = Object.values(st).filter(s => s.status !== 'paused')
    .map(s => `<strong class="num">${(s.picks || []).length}</strong> 檔${esc(s.label)}`);
  const gate = d.validation || {};
  let tail = d.channel === 'live'
    ? '訊號送<strong>正式頻道</strong>。'
    : `${gate.status === 'passed' ? '' : '策略驗證關卡尚未通過，'}訊號目前只送<strong>測試頻道</strong>。`;
  $('summary').innerHTML = parts.length ? `今日選出 ${parts.join('、')}。${tail}` : `今日沒有啟用中的策略。${tail}`;
  if (has(d.universe_count)) $('universe').textContent = `依收盤資料 · 上市櫃普通股 ${fmt(d.universe_count, 0)} 檔`;
  if (p.status === 'failed' && p.error) showNotice(`今日流程失敗：${esc(p.error)}`, 'bad');
}

let STRATS = {};
function renderPicks(k) {
  const s = STRATS[k];
  document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-selected', b.dataset.k === k ? 'true' : 'false'));
  $('channel').textContent = [s.status === 'paused' ? '暫停中' : null, s.holding ? `持有 ${s.holding}` : null, s.note].filter(Boolean).join(' · ');
  const rows = s.picks || [];
  if (s.status === 'paused') { $('picks').innerHTML = empty(`${s.label}策略暫停中`, '恢復後，選股結果會顯示在這裡。'); return; }
  if (!rows.length) { $('picks').innerHTML = empty('今日沒有符合條件的股票', '策略條件都沒有股票達到，明天收盤後再更新。'); return; }
  $('picks').innerHTML = '<div class="table-wrap"><table><thead><tr><th>股票</th><th class="r">收盤</th><th class="r">漲跌</th><th>選入原因</th></tr></thead><tbody>' +
    rows.map(r => `<tr>
      <td><div class="stock"><span class="name">${esc(r.name)}</span><span class="code">${esc(r.code)}</span></div></td>
      <td class="r num">${fmt(r.close)}</td>
      <td class="r num ${dir(r.change_pct)}">${has(r.change_pct) ? signed(r.change_pct) + '%' : '—'}</td>
      <td class="reason">${esc(r.reason)}<div class="tags">${(r.tags || []).map(t => `<span class="tag">${esc(t)}</span>`).join('')}</div></td>
    </tr>`).join('') + '</tbody></table></div>';
}

function renderStrategies(d) {
  STRATS = d.strategies || {};
  const keys = Object.keys(STRATS);
  if (!keys.length) { $('tabs').hidden = true; $('picks').innerHTML = empty('沒有選股資料', '資料檔裡沒有策略結果。'); return; }
  $('tabs').innerHTML = keys.map(k => {
    const s = STRATS[k];
    const extra = s.status === 'paused' ? '<span class="paused">暫停中</span>' : `<span class="count">${(s.picks || []).length}</span>`;
    return `<button class="tab" role="tab" data-k="${esc(k)}">${esc(s.label || k)} ${extra}</button>`;
  }).join('');
  document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => {
    renderPicks(b.dataset.k);
    try { localStorage.setItem('tab', b.dataset.k); } catch (e) {}
  }));
  let start = keys[0];
  try { const t = localStorage.getItem('tab'); if (t && STRATS[t]) start = t; } catch (e) {}
  renderPicks(start);
}

function spark(history) {
  const v = (history || []).map(h => h.close).filter(has);
  if (v.length < 2) return '';
  const W = 300, H = 44, pad = 4, min = Math.min(...v), max = Math.max(...v), span = (max - min) || 1;
  const pts = v.map((n, i) => `${(i * W / (v.length - 1)).toFixed(1)},${(H - pad - (n - min) / span * (H - pad * 2)).toFixed(1)}`).join(' ');
  const c = v[v.length - 1] >= v[0] ? 'var(--up)' : 'var(--down)';
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-label="近 ${v.length} 日走勢">
    <polygon points="0,${H} ${pts} ${W},${H}" fill="${c}" fill-opacity=".10"></polygon>
    <polyline points="${pts}" fill="none" stroke="${c}" stroke-width="1.6" vector-effect="non-scaling-stroke"></polyline></svg>`;
}

function renderMarket(d) {
  const m = d.market;
  if (!m) { $('market').innerHTML = empty('沒有大盤資料', '今日指數資料尚未取得。'); return; }
  if (d.trade_date) $('mkt-date').textContent = `${d.trade_date.slice(5).replace('-', '/')} 收盤`;
  const idx = (name, x) => x ? `<div class="index-row">
      <span class="name">${name}</span><span></span>
      <span class="val">${fmt(x.close, 2)}</span>
      <span class="chg ${dir(x.change)}">${x.change > 0 ? '▲' : x.change < 0 ? '▼' : ''} ${fmt(Math.abs(x.change ?? 0), 2)}<br>${signed(x.change_pct)}%</span>
      ${spark(x.history)}</div>` : '';
  const inst = m.institutional;
  let flows = '';
  if (inst) {
    const items = [['外資', inst.foreign], ['投信', inst.trust], ['自營商', inst.dealer]].filter(([, v]) => has(v));
    const peak = Math.max(...items.map(([, v]) => Math.abs(v)), 1);
    flows = `<div class="flows" aria-label="三大法人買賣超"><span class="label">三大法人買賣超（億元）</span>` +
      items.map(([n, v]) => {
        const w = (Math.abs(v) / peak * 48).toFixed(1);
        const side = v >= 0 ? `left:50%;width:${w}%;background:var(--up)` : `right:50%;width:${w}%;background:var(--down)`;
        return `<div class="flow"><span>${n}</span><div class="bar-track"><div class="bar" style="${side}"></div></div><span class="amt num ${dir(v)}">${signed(v, 1)}</span></div>`;
      }).join('') + '</div>';
  }
  $('market').innerHTML = idx('加權指數', m.taiex) + idx('櫃買指數', m.otc) + flows;
}

function renderGate(d) {
  const g = d.validation;
  if (!g) { $('gate').innerHTML = empty('沒有驗證資料', '回測完成後會顯示在這裡。'); return; }
  const map = { passed: ['ok', '已通過'], failed: ['bad', '未通過'], pending: ['warn', '尚未通過'] };
  const [cls, label] = map[g.status] || map.pending;
  $('gate-pill').className = 'pill ' + cls;
  $('gate-pill').textContent = label;
  const sMap = { passed: ['ok', '通過'], failed: ['bad', '未通過'], pending: ['idle', '等待回測'] };
  const strategies = Object.entries(g.strategies || {}).map(([k, s]) => {
    const [sc, sl] = sMap[s.status] || sMap.pending;
    const periods = (s.periods || []).map(p => {
      const v = has(p.excess_return_pct)
        ? `<span class="v ${dir(p.excess_return_pct)}">${signed(p.excess_return_pct)}%</span><span class="n">${has(p.samples) ? fmt(p.samples, 0) + ' 筆' : ''}</span>`
        : '<span class="v">—</span>';
      const state = p.passed === true ? ' pass' : p.passed === false ? ' fail' : '';
      return `<div class="period${state}">${esc(p.label)}${v}</div>`;
    }).join('');
    return `<div class="gate-strategy">
      <div class="top"><b>${esc(s.label || (STRATS[k] || {}).label || k)}</b><span class="pill ${sc}">${sl}</span></div>
      <div class="periods">${periods}</div></div>`;
  }).join('');
  const rules = (g.rules || []).map(r => `<li>${esc(r)}</li>`).join('');
  $('gate').innerHTML = strategies + (rules ? `<ul class="rules">${rules}</ul>` : '') +
    (g.note ? `<p class="gate-note">${esc(g.note)}</p>` : '');
}

function renderSchedule(d) {
  const s = d.schedule || [];
  $('schedule').innerHTML = s.length
    ? s.map(i => `<li><span class="t">${esc(i.time)}</span><span>${esc(i.name)}<span class="d">${esc(i.detail)}</span></span>${pill(i.status)}</li>`).join('')
    : `<li>${empty('沒有排程資料', '')}</li>`;
}

function renderBackfill(d) {
  const b = d.backfill;
  if (!b || !b.length) { $('backfill-panel').hidden = true; return; }
  $('backfill').innerHTML = b.map(i => {
    const pct = i.total ? Math.min(100, i.done / i.total * 100) : (i.status === 'done' ? 100 : 0);
    const right = i.status === 'done' ? (i.range ? `${esc(i.range)} · 完成` : '完成')
      : i.total ? `${fmt(i.done, 0)} / ${fmt(i.total, 0)} ${esc(i.unit || '')}` : (STATUS[i.status] || ['', '等待中'])[1];
    return `<div class="prog${i.status === 'done' ? ' done' : ''}${i.status === 'failed' ? ' failed' : ''}">
      <div class="row"><span>${esc(i.name)}</span><span>${right}</span></div>
      <div class="track"><div class="fill" style="width:${pct.toFixed(1)}%"></div></div>
      ${i.note ? `<div class="sub">${esc(i.note)}</div>` : ''}</div>`;
  }).join('');
}

function render(d) {
  if (DEMO) showNotice('示範資料：這些股票、價格與數字都是範例，不是系統實際輸出。<a href="#" id="exit-demo">看實際資料</a>', 'warn');
  if (d.generated_at) $('footer').textContent = `資料產生時間 ${d.generated_at.replace('T', ' ').slice(0, 16)}　·　` + $('footer').textContent;
  renderHeader(d); renderStrategies(d); renderMarket(d); renderGate(d); renderSchedule(d); renderBackfill(d);
}

function renderMissing(reason) {
  $('pipeline-pill').textContent = '尚無資料';
  $('summary').textContent = '選股系統還沒有產生資料。';
  showNotice(`${esc(reason)}。系統每天 18:45 收盤後流程跑完會自動更新這一頁。<a href="#demo">先看範例畫面</a>`, 'warn');
  ['picks', 'market', 'gate'].forEach(id => $(id).innerHTML = empty('等待第一份資料', ''));
  $('tabs').hidden = true;
  $('schedule-panel').hidden = true;
  $('backfill-panel').hidden = true;
}

addEventListener('hashchange', () => location.reload());
document.addEventListener('click', e => { if (e.target.id === 'exit-demo') { e.preventDefault(); location.hash = ''; } });

fetch(SRC, { cache: 'no-store' })
  .then(r => { if (!r.ok) throw new Error(r.status === 404 ? '找不到資料檔' : `資料讀取失敗（${r.status}）`); return r.json(); })
  .then(d => {
    if (d.schema_version !== 1) throw new Error(`資料格式版本不符（${d.schema_version}）`);
    render(d);
  })
  .catch(err => renderMissing(err.message || '資料讀取失敗'));
</script>
</body>
</html>
