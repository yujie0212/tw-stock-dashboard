<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>監控台活潑版預覽</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: sticky status bar → one-line daily summary → picks (wide) beside market + gate → schedule & data strip */
/* 固定深色主題 */
:root {
  --bg: #0d1218;
  --surface: #151c25;
  --line: #263140;
  --fg: #e6ebf2;
  --muted: #8e9bad;
  --accent: #7fb0e6;
  --accent-soft: #1b2a3b;
  --up: #f0776b;      /* 台股慣例：紅漲 */
  --down: #4cc492;    /* 綠跌 */
  --warn: #e5b05c;
  --warn-soft: #30271a;
  --ok-soft: #142d23;
  --up-soft: #3a1f1d;
  --down-soft: #142d23;
  --c-short: #f2a65a;   /* 短線 */
  --c-swing: #a99bf5;   /* 波段 */
  --c-long: #8e9bad;    /* 中長線 */
  --font-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.55;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface);
}
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.up { color: var(--up); }
.down { color: var(--down); }
.wrap {
  max-width: 1120px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* Top bar */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--surface); border-bottom: 1px solid var(--line);
}
.topbar .wrap {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px;
  padding-block: 12px;
}
.brand { display: flex; align-items: baseline; gap: 10px; margin-right: auto; }
.brand h1 { font-size: 18px; margin: 0; font-weight: 700; letter-spacing: .02em; }
.brand .date { color: var(--muted); font-size: 13px; }
.pill {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 12.5px; font-weight: 500; padding: 3px 10px; border-radius: 999px;
  white-space: nowrap;
}
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.pill.ok { background: var(--ok-soft); color: var(--down); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.idle { background: var(--accent-soft); color: var(--muted); }

.notice {
  font-size: 13px; color: var(--warn); background: var(--warn-soft);
  padding: 8px 12px; border-radius: 6px; margin-bottom: 14px;
}
.notice.bad { color: var(--up); background: var(--up-soft); }
.notice a { color: inherit; font-weight: 500; margin-left: 6px; }

/* Summary line */
.summary { padding-block: 20px 8px; }
.summary p { margin: 0; font-size: 17px; max-width: 62ch; text-wrap: pretty; }
.summary strong { font-weight: 700; }

/* Main grid */
.grid {
  display: grid; gap: 16px; padding-block: 12px 32px;
  grid-template-columns: minmax(0, 1.65fr) minmax(0, 1fr);
  align-items: start;
}
.side { display: grid; gap: 16px; min-width: 0; }
@media (max-width: 860px) { .grid { grid-template-columns: minmax(0, 1fr); } }

.panel {
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  min-width: 0;
}
.panel-head {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px;
  padding: 14px 16px 10px;
}
.panel-head h2 { font-size: 15px; margin: 0; font-weight: 700; margin-right: auto; text-wrap: balance; }
.label {
  font-size: 11.5px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase;
}

/* Tabs */
.tabs { display: flex; gap: 4px; padding: 0 16px; border-bottom: 1px solid var(--line); overflow-x: auto; overflow-y: hidden; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  background: none; border: 0; font: inherit; color: var(--muted); cursor: pointer;
  padding: 8px 10px 10px; border-bottom: 2px solid transparent;
  display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
}
.tab[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); font-weight: 500; }
.tab:focus-visible, .seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.tab .count { font-family: var(--font-num); font-size: 12px; color: var(--muted); }
.tab .paused { font-size: 11px; color: var(--warn); }

.channel {
  display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center;
  padding: 10px 16px; font-size: 13px; color: var(--muted);
}

/* Picks table */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th {
  text-align: left; font-weight: 500; font-size: 12px; color: var(--muted);
  padding: 8px 16px; border-bottom: 1px solid var(--line); white-space: nowrap;
}
td { padding: 11px 16px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
th.r, td.r { text-align: right; }
.stock { display: flex; flex-direction: column; }
.stock .code { font-family: var(--font-num); font-size: 12.5px; color: var(--muted); }
.stock .name { font-weight: 500; white-space: nowrap; }
.reason { color: var(--muted); font-size: 13px; min-width: 180px; }
.tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.tag { font-size: 11.5px; padding: 1px 7px; border-radius: 4px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
.empty { padding: 28px 16px; color: var(--muted); font-size: 14px; }
.empty strong { color: var(--fg); display: block; margin-bottom: 4px; }

/* Market */
.market { padding: 0 16px 16px; display: grid; gap: 14px; }
.index-row { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; align-items: end; }
.index-row .name { font-size: 13px; color: var(--muted); }
.index-row .val { font-family: var(--font-num); font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
.index-row .chg { font-family: var(--font-num); font-size: 13px; text-align: right; }
.spark { grid-column: 1 / -1; width: 100%; height: 44px; display: block; }
.flows { display: grid; gap: 8px; border-top: 1px solid var(--line); padding-top: 12px; }
.flow { display: grid; grid-template-columns: 4.5em 1fr 6.5em; align-items: center; gap: 10px; font-size: 13px; }
.flow .bar-track { height: 8px; background: var(--bg); border-radius: 4px; position: relative; overflow: hidden; }
.flow .bar { position: absolute; top: 0; bottom: 0; border-radius: 4px; }
.flow .bar-track::after { content: ""; position: absolute; left: 50%; top: -2px; bottom: -2px; width: 1px; background: var(--line); }
.flow .amt { text-align: right; }
.funds { display: grid; gap: 10px; border-top: 1px solid var(--line); padding-top: 12px; }
.fund { display: grid; grid-template-columns: 1fr auto; gap: 0 12px; align-items: baseline; }
.fund .name { font-size: 13px; }
.fund .val { font-family: var(--font-num); font-variant-numeric: tabular-nums; font-size: 15px; font-weight: 600; text-align: right; }
.fund .sub { font-size: 11.5px; color: var(--muted); }
.fund .chg { font-family: var(--font-num); font-size: 12.5px; text-align: right; }
.holder { white-space: nowrap; }
.holder .wk { display: block; font-size: 11.5px; }
th .sub { display: block; font-size: 11px; font-weight: 400; }

/* Gate */
.gate { padding: 0 16px 16px; display: grid; gap: 12px; }
.gate-strategy { display: grid; gap: 6px; }
.gate-strategy .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.gate-strategy .top b { font-size: 14px; }
.periods { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.period { border: 1px dashed var(--line); border-radius: 6px; padding: 6px 8px; font-size: 12px; color: var(--muted); }
.period .v { display: block; font-family: var(--font-num); color: var(--fg); font-size: 13px; margin-top: 2px; }
.rules { margin: 0; padding: 10px 0 0; border-top: 1px solid var(--line); list-style: none; display: grid; gap: 4px; font-size: 12.5px; color: var(--muted); }
.rules li::before { content: "·"; margin-right: 6px; color: var(--accent); font-weight: 700; }

/* Bottom: schedule + data */
.bottom { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); padding-bottom: 40px; }
@media (max-width: 860px) { .bottom { grid-template-columns: minmax(0, 1fr); } }
.timeline { list-style: none; margin: 0; padding: 0 16px 16px; display: grid; }
.timeline li { display: grid; grid-template-columns: 3.6em 1fr auto; gap: 12px; padding: 9px 0; border-top: 1px solid var(--line); align-items: baseline; font-size: 14px; }
.timeline li:first-child { border-top: 0; }
.timeline .t { font-family: var(--font-num); font-weight: 500; }
.timeline .d { color: var(--muted); font-size: 12.5px; display: block; }
.progress-list { padding: 0 16px 16px; display: grid; gap: 12px; }
.prog .row { display: flex; justify-content: space-between; gap: 8px; font-size: 13.5px; margin-bottom: 5px; }
.prog .row span:last-child { color: var(--muted); font-family: var(--font-num); font-size: 12.5px; white-space: nowrap; }
.prog .track { height: 6px; border-radius: 3px; background: var(--bg); overflow: hidden; }
.prog .fill { height: 100%; background: var(--accent); border-radius: 3px; }
.prog.done .fill { background: var(--down); }
.prog .sub { font-size: 12px; color: var(--muted); margin-top: 4px; }

footer { color: var(--muted); font-size: 12px; padding-block: 0 32px; }

@media (max-width: 520px) {
  .summary p { font-size: 16px; }
  .reason { min-width: 150px; }
  th, td { padding-left: 12px; padding-right: 12px; }
}
@media (prefers-reduced-motion: no-preference) {
  .tab { transition: color .15s, border-color .15s; }
}

.pill.bad { background: var(--up-soft); color: var(--up); }
.period.pass { border-style: solid; border-color: var(--down); }
.period.fail { border-style: solid; border-color: var(--up); }
.period .n { display: block; font-size: 11px; }
.gate-note { margin: 0; font-size: 12.5px; color: var(--muted); }
.prog.failed .fill { background: var(--up); }

/* ---- 1. 行情卡片 ---- */
.tickers { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; padding-block: 4px 8px; }
@media (max-width: 760px) { .tickers { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.tick {
  --tone: var(--muted);
  position: relative; overflow: hidden; min-width: 0;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  padding: 12px 14px 13px; display: grid; gap: 2px;
}
.tick::before {
  content: ""; position: absolute; inset: auto -30% -70% auto; width: 90%; aspect-ratio: 1;
  background: radial-gradient(circle, var(--tone) 0%, transparent 65%); opacity: .22; pointer-events: none;
}
.tick::after { content: ""; position: absolute; inset: 0 0 auto; height: 2px; background: var(--tone); opacity: .85; }
.tick.up { --tone: var(--up); }
.tick.down { --tone: var(--down); }
.tick .k { font-size: 12.5px; color: var(--muted); display: flex; justify-content: space-between; gap: 6px; }
.tick .k small { font-size: 11px; white-space: nowrap; }
.tick .v { font-family: var(--font-num); font-variant-numeric: tabular-nums; font-size: clamp(19px, 2.4vw, 26px); font-weight: 600; letter-spacing: -.01em; white-space: nowrap; }
.tick .v .u { font-size: .55em; font-weight: 500; color: var(--muted); margin-left: 3px; }
.tick .c { font-family: var(--font-num); font-size: 12.5px; color: var(--tone); white-space: nowrap; }
.tick.flat .c { color: var(--muted); }

/* ---- 2. 表格色彩 ---- */
#picks-panel { --s: var(--c-short); }
#picks-panel[data-k="swing"] { --s: var(--c-swing); }
#picks-panel[data-k="long"] { --s: var(--c-long); }
.tab[aria-selected="true"] { border-bottom-color: var(--s); }
.tab[data-k="short"] .count { color: var(--c-short); }
.tab[data-k="swing"] .count { color: var(--c-swing); }
.tab .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
.tab[data-k="short"] .dot { background: var(--c-short); }
.tab[data-k="swing"] .dot { background: var(--c-swing); }
.tab[data-k="long"] .dot { background: var(--c-long); }
.channel { border-left: 3px solid var(--s); margin: 10px 16px 4px; padding: 2px 10px; }
.tag { background: color-mix(in srgb, var(--s) 16%, transparent); color: var(--s); }
.chip { display: inline-block; padding: 2px 7px; border-radius: 5px; font-family: var(--font-num); font-size: 13px; white-space: nowrap; }
.chip.up { background: var(--up-soft); color: var(--up); }
.chip.down { background: var(--down-soft); color: var(--down); }
.chip.limit { box-shadow: inset 0 0 0 1px var(--up); }
.hbar { display: grid; gap: 4px; justify-items: end; min-width: 84px; }
.hbar .track { width: 84px; height: 5px; border-radius: 3px; background: var(--bg); overflow: hidden; }
.hbar .fill { height: 100%; border-radius: 3px; background: var(--s); width: 0; }
.hbar .row { display: flex; gap: 6px; align-items: baseline; }
.hbar .wk { font-size: 11px; }
tbody tr { transition: background-color .15s; }
tbody tr:hover { background: color-mix(in srgb, var(--s) 6%, transparent); }

/* ---- 3. 走勢圖 ---- */
.seg { display: inline-flex; background: var(--bg); border-radius: 8px; padding: 3px; gap: 2px; }
.seg button { font: inherit; font-size: 12.5px; border: 0; background: none; color: var(--muted); padding: 4px 10px; border-radius: 6px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 0 0 1px var(--line); }
.chart { position: relative; touch-action: pan-y; }
.chart svg { display: block; width: 100%; height: 150px; overflow: visible; }
.chart .grid-l { stroke: var(--line); stroke-width: 1; stroke-dasharray: 2 4; }
.chart .axis { fill: var(--muted); font-size: 10px; font-family: var(--font-num); }
.chart .cross { stroke: var(--muted); stroke-width: 1; }
.chart .tip {
  position: absolute; top: 0; transform: translateX(-50%); pointer-events: none;
  background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px;
  font-family: var(--font-num); font-size: 12px; white-space: nowrap;
}
.chart .tip span { color: var(--muted); margin-right: 6px; }
.chart-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.chart-head .last { font-family: var(--font-num); font-size: 20px; font-weight: 600; }
.chart-head .chg { font-family: var(--font-num); font-size: 13px; }

/* 進場動畫 */
@media (prefers-reduced-motion: no-preference) {
  .rise { animation: rise .5s cubic-bezier(.2,.7,.2,1) both; animation-delay: calc(var(--i, 0) * 70ms); }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } }
  .hbar .fill { transition: width .8s cubic-bezier(.2,.7,.2,1); }
  #picks tbody tr { animation: rise .35s ease-out both; animation-delay: calc(var(--i, 0) * 45ms); }
}
</style>
</head>
<body>


<header class="topbar">
  <div class="wrap">
    <div class="brand">
      <h1>台股選股監控台</h1>
      <span class="date num" id="trade-date">—</span>
    </div>
    <span class="pill idle" id="pipeline-pill">載入中</span>
    <span class="pill idle" id="channel-pill" hidden></span>
  </div>
</header>

<main>
  <section class="wrap summary" aria-label="今日摘要">
    <div class="notice" id="notice" hidden></div>
    <p id="summary">讀取資料中…</p>
  </section>

  <section class="wrap tickers" id="tickers" aria-label="行情"></section>

  <div class="wrap grid">
    <section class="panel rise" style="--i:4" aria-labelledby="picks-title" id="picks-panel">
      <div class="panel-head">
        <h2 id="picks-title">今日選股</h2>
        <span class="label" id="universe"></span>
      </div>
      <div class="tabs" role="tablist" aria-label="策略" id="tabs"></div>
      <div class="channel" id="channel"></div>
      <div id="picks"></div>
    </section>

    <div class="side">
      <section class="panel rise" style="--i:5" aria-labelledby="mkt-title">
        <div class="panel-head">
          <h2 id="mkt-title">大盤走勢</h2>
          <div class="seg" id="idx-seg" role="group" aria-label="指數">
            <button type="button" id="seg-taiex" data-k="taiex" aria-pressed="true">加權</button>
            <button type="button" id="seg-otc" data-k="otc" aria-pressed="false">櫃買</button>
          </div>
        </div>
        <div class="market" id="market"></div>
      </section>

      <section class="panel rise" style="--i:6" aria-labelledby="gate-title">
        <div class="panel-head">
          <h2 id="gate-title">策略驗證關卡</h2>
          <span class="pill idle" id="gate-pill">—</span>
        </div>
        <div class="gate" id="gate"></div>
      </section>
    </div>
  </div>

  <div class="wrap bottom">
    <section class="panel rise" style="--i:7" aria-labelledby="sched-title" id="schedule-panel">
      <div class="panel-head"><h2 id="sched-title">每日排程</h2><span class="label">台灣時間</span></div>
      <ol class="timeline" id="schedule"></ol>
    </section>

    <section class="panel rise" style="--i:8" aria-labelledby="data-title" id="backfill-panel">
      <div class="panel-head"><h2 id="data-title">歷史回補進度</h2><span class="label">一次性 · 回測用</span></div>
      <div class="progress-list" id="backfill"></div>
    </section>
  </div>

  <footer class="wrap" id="footer">資料來源：證交所、櫃買中心公開資料。本頁僅供個人研究參考，不構成投資建議。</footer>
</main>

<script>
const DEMO = true;
const SRC = DEMO ? 'data/example.json' : 'data/latest.json';
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const has = (v) => v !== null && v !== undefined;
const fmt = (n, d) => has(n) ? Number(n).toLocaleString('zh-TW', { minimumFractionDigits: d ?? (Math.abs(n) < 1000 ? 2 : 0), maximumFractionDigits: d ?? 2 }) : '—';
const dir = (n) => n > 0 ? 'up' : n < 0 ? 'down' : '';
const signed = (n, d = 2) => has(n) ? (n > 0 ? '+' : n < 0 ? '−' : '') + fmt(Math.abs(n), d) : '—';
const WEEK = '日一二三四五六';
const CALM = matchMedia('(prefers-reduced-motion: reduce)').matches;

// Count a number up from 0 to its value; final text is set immediately when motion is reduced.
function countUp(root) {
  root.querySelectorAll('[data-to]').forEach(el => {
    const to = Number(el.dataset.to), dec = Number(el.dataset.dec || 0), pre = el.dataset.pre || '';
    const show = (v) => { el.textContent = pre + fmt(v, dec); };
    if (CALM || !isFinite(to)) { show(to); return; }
    const t0 = performance.now(), dur = 900;
    const step = (t) => {
      const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3);
      show(to * e);
      if (k < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  });
}
const num = (v, dec, pre = '') => has(v) ? `<span data-to="${Number(v)}" data-dec="${dec}" data-pre="${pre}">${pre}${fmt(Number(v), dec)}</span>` : '—';

const STATUS = {
  done: ['ok', '完成'], ok: ['ok', '完成'], sent: ['ok', '已送出'],
  running: ['idle', '執行中'], scheduled: ['idle', '排程中'], pending: ['idle', '等待中'],
  failed: ['bad', '失敗'], skipped: ['idle', '略過']
};
const pill = (status, text) => {
  const [cls, label] = STATUS[status] || ['idle', status || '—'];
  return `<span class="pill ${cls}">${esc(text || label)}</span>`;
};
const empty = (title, text) => `<div class="empty"><strong>${esc(title)}</strong>${esc(text)}</div>`;

function showNotice(html, kind) {
  const n = $('notice');
  n.className = 'notice ' + (kind || '');
  n.innerHTML = html;
  n.hidden = false;
}

function renderHeader(d) {
  if (d.trade_date) {
    const day = new Date(d.trade_date + 'T12:00:00Z').getUTCDay();
    $('trade-date').textContent = `${d.trade_date}（${WEEK[day]}）`;
  }
  const p = d.pipeline || {};
  const pp = $('pipeline-pill');
  const [cls, label] = STATUS[p.status] || ['idle', '狀態不明'];
  pp.className = 'pill ' + cls;
  pp.textContent = `收盤後流程${label}${p.finished_at ? ' ' + p.finished_at : ''}`;
  const cp = $('channel-pill');
  cp.hidden = false;

function renderStrategies(d) {

function spark(history) {
  const v = (history || []).map(h => h.close).filter(has);
  if (v.length < 2) return '';
  const W = 300, H = 44, pad = 4, min = Math.min(...v), max = Math.max(...v), span = (max - min) || 1;
  const pts = v.map((n, i) => `${(i * W / (v.length - 1)).toFixed(1)},${(H - pad - (n - min) / span * (H - pad * 2)).toFixed(1)}`).join(' ');
  const c = v[v.length - 1] >= v[0] ? 'var(--up)' : 'var(--down)';
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-label="近 ${v.length} 日走勢">
    <polygon points="0,${H} ${pts} ${W},${H}" fill="${c}" fill-opacity=".10"></polygon>
    <polyline points="${pts}" fill="none" stroke="${c}" stroke-width="1.6" vector-effect="non-scaling-stroke"></polyline></svg>`;
}

function renderTickers(d) {
  const m = d.market || {};
  const cards = [];
  const idx = (name, x) => {

    const t = dir(x.change_pct) || 'flat';
    cards.push(`<div class="tick ${t}"><span class="k">${name}</span>
      <span class="v">${num(x.close, 2)}</span>
      <span class="c">${x.change > 0 ? '▲' : x.change < 0 ? '▼' : ''} ${fmt(Math.abs(x.change ?? 0), 2)}　${signed(x.change_pct)}%</span></div>`);
  };
  idx('加權指數', m.taiex);
  idx('櫃買指數', m.otc);
  const mg = m.margin;
  if (mg && has(mg.balance_100m)) {
    const c = mg.change_100m, t = dir(c) || 'flat';
    cards.push(`<div class="tick ${t}"><span class="k">融資餘額<small>${esc((mg.date || '').slice(5).replace('-', '/'))}</small></span>
      <span class="v">${num(mg.balance_100m, 1)}<span class="u">億</span></span>
      <span class="c">${has(c) ? (c > 0 ? '▲ 增 ' : c < 0 ? '▼ 減 ' : '') + fmt(Math.abs(c), 1) + ' 億' : '—'}</span></div>`);
  }
  const fx = m.fx;
  if (fx && has(fx.usd_twd)) {
    const p = fx.usd_twd_change_pct;
    // Positive = more TWD per USD = TWD weakened; colour follows the TWD itself.
    const t = has(p) ? (dir(-p) || 'flat') : 'flat';
    const move = !has(p) ? '—' : p > 0 ? `▼ 台幣貶值 ${fmt(p, 2)}%` : p < 0 ? `▲ 台幣升值 ${fmt(-p, 2)}%` : '台幣持平';
    cards.push(`<div class="tick ${t}"><span class="k">美元／台幣<small>${esc((fx.date || '').slice(5).replace('-', '/'))}</small></span>
      <span class="v">${num(Number(fx.usd_twd), 3)}</span>
      <span class="c">${move}</span></div>`);
  }
  $('tickers').innerHTML = cards.map((c, i) => c.replace('<div class="tick ', `<div style="--i:${i}" class="rise tick `)).join('');
  $('tickers').hidden = !cards.length;
}

let MARKET = {};
function chart(x) {
  const pts = (x.history || []).filter(h => has(h.close));
  if (pts.length < 2) return empty('沒有走勢資料', '這個指數目前沒有近期收盤資料。');
  const W = 320, H = 150, L = 4, R = 4, T = 26, B = 18;
  const v = pts.map(p => p.close), min = Math.min(...v), max = Math.max(...v), span = (max - min) || 1;
  const X = i => L + i * (W - L - R) / (pts.length - 1);
  const Y = n => T + (1 - (n - min) / span) * (H - T - B);
  const line = pts.map((p, i) => `${X(i).toFixed(1)},${Y(p.close).toFixed(1)}`).join(' ');
  const c = v[v.length - 1] >= v[0] ? 'var(--up)' : 'var(--down)';
  const grid = [0, .5, 1].map(f => { const y = (T + f * (H - T - B)).toFixed(1); return `<line class="grid-l" x1="${L}" x2="${W - R}" y1="${y}" y2="${y}"></line>`; }).join('');
  const lx = X(pts.length - 1), ly = Y(v[v.length - 1]);
  return `<div class="chart" id="chart">
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="近 ${pts.length} 個交易日收盤走勢">
      <defs><linearGradient id="g-area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c}" stop-opacity=".28"></stop><stop offset="1" stop-color="${c}" stop-opacity="0"></stop></linearGradient></defs>
      ${grid}
      <polygon points="${L},${H - B} ${line} ${W - R},${H - B}" fill="url(#g-area)"></polygon>
      <polyline points="${line}" fill="none" stroke="${c}" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke"></polyline>
      <line class="cross" id="cross" x1="0" x2="0" y1="${T}" y2="${H - B}" vector-effect="non-scaling-stroke" visibility="hidden"></line>
      <circle id="hot" r="3.5" fill="${c}" stroke="var(--surface)" stroke-width="1.5" vector-effect="non-scaling-stroke" cx="${lx}" cy="${ly}"></circle>
      <text class="axis" x="${L}" y="${H - 4}">${esc(pts[0].date.slice(5).replace('-', '/'))}</text>
      <text class="axis" x="${W - R}" y="${H - 4}" text-anchor="end">${esc(pts[pts.length - 1].date.slice(5).replace('-', '/'))}</text>
    </svg>
    <div class="tip" id="tip" hidden></div></div>`;
}

function wireChart(x) {
  const box = $('chart'); if (!box) return;
  const pts = (x.history || []).filter(h => has(h.close));
  const svg = box.querySelector('svg'), cross = $('cross'), hot = $('hot'), tip = $('tip');
  const W = 320, L = 4, R = 4;
  const lastX = hot.getAttribute('cx'), lastY = hot.getAttribute('cy');
  const move = (e) => {
    const r = svg.getBoundingClientRect();
    const rel = (e.clientX - r.left) / r.width * W;
    const i = Math.max(0, Math.min(pts.length - 1, Math.round((rel - L) / (W - L - R) * (pts.length - 1))));
    const cx = L + i * (W - L - R) / (pts.length - 1);
    const poly = svg.querySelector('polyline').getAttribute('points').split(' ')[i].split(',');
    cross.setAttribute('x1', cx); cross.setAttribute('x2', cx); cross.setAttribute('visibility', 'visible');
    hot.setAttribute('cx', poly[0]); hot.setAttribute('cy', poly[1]);
    tip.innerHTML = `<span>${esc(pts[i].date.slice(5).replace('-', '/'))}</span>${fmt(pts[i].close, 2)}`;
    tip.hidden = false;
    const px = cx / W * r.width;
    tip.style.left = Math.max(48, Math.min(r.width - 48, px)) + 'px';
  };
  const leave = () => { cross.setAttribute('visibility', 'hidden'); hot.setAttribute('cx', lastX); hot.setAttribute('cy', lastY); tip.hidden = true; };
  svg.addEventListener('pointermove', move);
  svg.addEventListener('pointerdown', move);
  svg.addEventListener('pointerleave', leave);
}

function showIndex(k) {

}

function renderMarket(d) {
  const m = d.market;
  if (!m) { $('market').innerHTML = empty('沒有大盤資料', '今日指數資料尚未取得。'); return; }
  MARKET = { taiex: m.taiex, otc: m.otc };
  const inst = m.institutional;

  if (items.length) {
    const peak = Math.max(...items.map(([, v]) => Math.abs(v)), 1);
    flows = `<div class="flows" aria-label="三大法人買賣超"><span class="label">三大法人買賣超（億元）</span>` +
      items.map(([n, v]) => {
        const w = (Math.abs(v) / peak * 48).toFixed(1);

        return `<div class="flow"><span>${n}</span><div class="bar-track"><div class="bar" style="${side}"></div></div><span class="amt num ${dir(v)}">${signed(v, 1)}</span></div>`;
      }).join('') + '</div>';
  }
  $('market').innerHTML = `<div id="chart-slot"></div>` + flows;
  document.querySelectorAll('#idx-seg button').forEach(b => { b.onclick = () => showIndex(b.dataset.k); });
  showIndex('taiex');
}

function renderGate(d) {
  const g = d.validation;
  if (!g) { $('gate').innerHTML = empty('沒有驗證資料', '回測完成後會顯示在這裡。'); return; }
  const map = { passed: ['ok', '已通過'], failed: ['bad', '未通過'], pending: ['warn', '尚未通過'] };
  const [cls, label] = map[g.status] || map.pending;
  $('gate-pill').className = 'pill ' + cls;
  $('gate-pill').textContent = label;
  const sMap = { passed: ['ok', '通過'], failed: ['bad', '未通過'], pending: ['idle', '等待回測'] };
  const strategies = Object.entries(g.strategies || {}).map(([k, s]) => {
    const [sc, sl] = sMap[s.status] || sMap.pending;
    const periods = (s.periods || []).map(p => {
      const v = has(p.excess_return_pct)
        ? `<span class="v ${dir(p.excess_return_pct)}">${signed(p.excess_return_pct)}%</span><span class="n">${has(p.samples) ? fmt(p.samples, 0) + ' 筆' : ''}</span>`
        : '<span class="v">—</span>';
      const state = p.passed === true ? ' pass' : p.passed === false ? ' fail' : '';
      return `<div class="period${state}">${esc(p.label)}${v}</div>`;
    }).join('');
    return `<div class="gate-strategy">
      <div class="top"><b>${esc(s.label || (STRATS[k] || {}).label || k)}</b><span class="pill ${sc}">${sl}</span></div>
      <div class="periods">${periods}</div></div>`;
  }).join('');
  const rules = (g.rules || []).map(r => `<li>${esc(r)}</li>`).join('');
  $('gate').innerHTML = strategies + (rules ? `<ul class="rules">${rules}</ul>` : '') +
    (g.note ? `<p class="gate-note">${esc(g.note)}</p>` : '');
}

function renderSchedule(d) {
  const s = d.schedule || [];
  $('schedule').innerHTML = s.length

function renderBackfill(d) {
